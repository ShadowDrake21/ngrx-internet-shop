<div class="contact-us position-relative">
  <app-alert [alerts]="alerts"></app-alert>
  <div class="col-md-12">
    <div class="wrapper">
      <div class="row mb-3 mb-md-5">
        <div class="col-md-7">
          <div class="contact-wrap w-100 p-md-5 p-4">
            <h3 class="mb-2 mb-md-3 mb-lg-4 text-center text-md-start">
              Contact Us
            </h3>
            <form
              class="contactForm"
              [formGroup]="contactUsForm"
              (ngSubmit)="onFormSubmit()"
            >
              <div class="row">
                <div class="col-md-6 mb-3">
                  <div class="form-group">
                    <label class="label" for="name">Full Name</label>
                    <input
                      type="text"
                      class="form-control"
                      name="name"
                      placeholder="Name"
                      formControlName="name"
                      [class.error]="
                        (contactUsForm.controls.name.touched &&
                          contactUsForm.controls.name.invalid) ||
                        (contactUsForm.controls.name.dirty &&
                          contactUsForm.controls.name.invalid)
                      "
                    />
                  </div>
                </div>
                <div class="col-md-6 mb-3">
                  <div class="form-group">
                    <label class="label" for="email">Email Address</label>
                    <input
                      type="email"
                      class="form-control"
                      name="email"
                      placeholder="Email"
                      formControlName="email"
                      [class.error]="
                        (contactUsForm.controls.email.touched &&
                          contactUsForm.controls.email.invalid) ||
                        (contactUsForm.controls.email.dirty &&
                          contactUsForm.controls.email.invalid)
                      "
                    />
                  </div>
                </div>
                <div class="col-md-12 mb-3">
                  <div class="form-group">
                    <label class="label" for="subject">Subject</label>
                    <input
                      type="text"
                      class="form-control"
                      name="subject"
                      placeholder="Subject"
                      formControlName="subject"
                      [class.error]="
                        (contactUsForm.controls.subject.touched &&
                          contactUsForm.controls.subject.invalid) ||
                        (contactUsForm.controls.subject.dirty &&
                          contactUsForm.controls.subject.invalid)
                      "
                    />
                  </div>
                </div>
                <div class="col-md-12 mb-3">
                  <div class="form-group">
                    <label class="label" for="contact-us-textarea"
                      >Message</label
                    >
                    <textarea
                      id="contact-us-textarea"
                      name="message"
                      class="form-control"
                      cols="30"
                      rows="4"
                      placeholder="Message"
                      style="resize: none"
                      formControlName="message"
                      [class.error]="
                        (contactUsForm.controls.message.touched &&
                          contactUsForm.controls.message.invalid) ||
                        (contactUsForm.controls.message.dirty &&
                          contactUsForm.controls.message.invalid)
                      "
                    ></textarea>
                  </div>
                </div>
                <div class="col-md-12">
                  <div class="form-group">
                    <button
                      type="submit"
                      class="btn btn-primary"
                      [disabled]="contactUsForm.invalid"
                    >
                      Send message
                    </button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
        <div class="col-md-5 position-relative">
          <contact-us-form-error-messages [form]="contactUsForm" />
          <img
            class="contact-us__img"
            src="/assets/images/contact-us.jpg"
            alt="contact-us img"
          />
        </div>
      </div>
      <contact-us-form-author-info />
    </div>
  </div>
</div>
